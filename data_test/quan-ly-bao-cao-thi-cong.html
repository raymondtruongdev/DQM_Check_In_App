<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý Báo cáo thi công</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --ink:#1c2430; --muted:#5d6877; --line:#d5dae3;
  --brand:#1f4fd8; --brand-soft:#e6edff; --day:#b45309; --day-bg:#fff1dc; --week:#0f766e; --week-bg:#dcf5f0;
  --chip:#eef1f6; --shadow:0 1px 3px rgba(28,36,48,.10),0 4px 12px rgba(28,36,48,.06);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:1100px;margin:0 auto;padding:0 16px 32px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.icon-btn:hover{background:var(--chip)}
#home{background:#0f766e;border-color:#0f766e;color:#fff}
#home:hover{background:#115e59}
#refresh{background:#e6edff;border-color:#bfd0ff;color:#1f4fd8}
#refresh:hover{background:#d6e2ff}
h1{margin:0;font-size:1.2rem;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.sub{display:block;font-size:.82rem;font-weight:400;color:var(--muted)}
.btn-label{display:none}

.tools{display:flex;flex-direction:column;gap:12px;margin:4px 0 16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.search:focus-within{border-color:var(--brand);outline:2px solid var(--brand)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--ink)}
.search input::placeholder{color:var(--muted)}

.count{margin:0 0 10px;font-size:.88rem;color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.card{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit}
.card-top{display:flex;justify-content:space-between;align-items:center}
.chip{padding:3px 10px;border-radius:8px;background:var(--chip);font-size:.8rem;font-weight:700}
.badge{padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
.badge.day{background:var(--day-bg);color:var(--day)}
.badge.week{background:var(--week-bg);color:var(--week)}
.card-main{display:flex;gap:14px;align-items:center}
.ico{width:48px;height:48px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.ico svg{width:24px;height:24px}
.card-main h2{margin:0;font-size:1.05rem;font-weight:700;overflow-wrap:anywhere}
.card-main p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;border-top:1px dashed var(--line);flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;min-width:0}
.go{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.go:hover{filter:brightness(1.08)}
.go svg{width:18px;height:18px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin svg{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}.toast{transition:none}}

@media (min-width:640px){
  .app{padding:0 24px 40px}
  h1{font-size:1.5rem}
  .btn-label{display:inline}
  .grid{grid-template-columns:repeat(2,1fr);gap:16px}
  .tools{flex-direction:row-reverse;align-items:center;justify-content:space-between}
  .search{width:min(360px,40%)}
  .tabs{padding:0}
}
@media (min-width:1000px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .card:hover{border-color:var(--brand)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="icon-btn" id="home" aria-label="Trang chủ"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span class="btn-label">Trang chủ</span></button>
    <h1>Quản lý báo cáo thi công<span class="sub">Chọn báo cáo để nhập số liệu</span></h1>
    <button class="icon-btn" id="refresh" aria-label="Làm mới"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 00-14.5-4M4 4v4h4M4 13a8 8 0 0014.5 4M20 20v-4h-4"/></svg><span class="btn-label">Làm mới</span></button>
  </header>

  <div class="tools">
    <div class="tabs" id="tabs" role="group" aria-label="Lọc theo mã ga"></div>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Tìm mã ga, loại báo cáo, người quản lý" aria-label="Tìm báo cáo"></label>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <main class="grid" id="grid"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
var DATA=[
 {st:"ST01",type:"day",title:"ST01 DailyReport",desc:"Báo cáo ngày",who:"Trương Quốc Toàn"},
 {st:"ST01",type:"week",title:"ST01 WeeklyReport",desc:"Báo cáo tuần",who:"Trương Quốc Toàn"},
 {st:"ST02",type:"day",title:"ST02 DailyReport",desc:"Báo cáo ngày",who:"Trương Quốc Toàn"}
];
var cur="ALL",grid=document.getElementById("grid"),tabs=document.getElementById("tabs"),q=document.getElementById("q"),count=document.getElementById("count");
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d")}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function renderTabs(){
  var sts=[]; DATA.forEach(function(d){if(sts.indexOf(d.st)<0)sts.push(d.st)});
  var h='<button class="tab" aria-pressed="'+(cur==="ALL")+'" data-st="ALL">Tất cả ('+DATA.length+')</button>';
  sts.forEach(function(s){var n=DATA.filter(function(d){return d.st===s}).length;
    h+='<button class="tab" aria-pressed="'+(cur===s)+'" data-st="'+s+'">'+s+' ('+n+')</button>'});
  tabs.innerHTML=h;
}
function render(){
  var k=norm(q.value.trim());
  var list=DATA.filter(function(d){
    return (cur==="ALL"||d.st===cur)&&(!k||norm([d.st,d.title,d.desc,d.who].join(" ")).indexOf(k)>=0)});
  count.textContent=list.length+" báo cáo";
  if(!list.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Không có báo cáo phù hợp. Thử đổi từ khóa hoặc chọn "Tất cả".</div>';return}
  grid.innerHTML=list.map(function(d){
    var day=d.type==="day";
    var ic=day?'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><circle cx="12" cy="15" r="1.5"/></svg>'
              :'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';
    return '<article class="card"><div class="card-top"><span class="chip">'+esc(d.st)+'</span><span class="badge '+d.type+'">'+(day?"Ngày":"Tuần")+'</span></div>'
    +'<div class="card-main"><div class="ico">'+ic+'</div><div><h2>'+esc(d.title)+'</h2><p>'+esc(d.desc)+'</p></div></div>'
    +'<div class="card-foot"><span class="who"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'+esc(d.who)+'</span>'
    +'<button class="go" data-t="'+esc(d.title)+'">Nhập báo cáo<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div></article>'}).join("");
}
tabs.addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;cur=b.dataset.st;renderTabs();render()});
q.addEventListener("input",render);
grid.addEventListener("click",function(e){var b=e.target.closest(".go");if(b)toast("Mở "+b.dataset.t)});
document.getElementById("refresh").addEventListener("click",function(){
  var b=this;b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");render();toast("Đã làm mới")});
var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},1600)}
renderTabs();render();
</script>
</body>
</html>
